<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">When the map starts learning</title>
  <desc id="description">Immutable evidence flows into a maintained living map that links and synthesizes knowledge, then provides focused source-grounded context to product, engineering, and AI agents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#172832"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <circle cx="1080" cy="78" r="190" fill="#78a9c4" opacity=".07"/>
  <circle cx="98" cy="596" r="240" fill="#eab65c" opacity=".05"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="64" y="78" fill="#eab65c" font-size="17" font-weight="700" letter-spacing="3">A SHARED MEMORY FOR HUMANS AND AI</text>
    <text x="64" y="128" fill="#f4f5f6" font-size="40" font-weight="750">The map can learn. The sources still decide.</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="64" y="188" width="280" height="360" rx="20" fill="#202b35" stroke="#3b4855"/>
    <text x="96" y="230" fill="#f4f5f6" font-size="20" font-weight="700">Immutable evidence</text>
    <text x="96" y="258" fill="#aeb8c2" font-size="15">Authority and provenance</text>

    <g fill="#17212a" stroke="#455462">
      <rect x="96" y="298" width="216" height="46" rx="10"/>
      <rect x="96" y="356" width="216" height="46" rx="10"/>
      <rect x="96" y="414" width="216" height="46" rx="10"/>
      <rect x="96" y="472" width="216" height="46" rx="10"/>
    </g>
    <g fill="#d8dde2" font-size="15">
      <text x="120" y="327">Product decisions</text>
      <text x="120" y="385">Code and pull requests</text>
      <text x="120" y="443">Incidents and conversations</text>
      <text x="120" y="501">Specs, tickets, and ADRs</text>
    </g>

    <rect x="460" y="188" width="280" height="360" rx="20" fill="#202b35" stroke="#eab65c" stroke-width="2"/>
    <text x="492" y="230" fill="#f4f5f6" font-size="20" font-weight="700">Living map</text>
    <text x="492" y="258" fill="#aeb8c2" font-size="15">Derived, linked, and inspectable</text>

    <g fill="#17212a" stroke="#eab65c">
      <circle cx="532" cy="332" r="28"/>
      <circle cx="652" cy="322" r="28"/>
      <circle cx="586" cy="408" r="28"/>
      <circle cx="680" cy="454" r="28"/>
      <circle cx="512" cy="482" r="28"/>
    </g>
    <g fill="none" stroke="#eab65c" stroke-linecap="round" stroke-width="4">
      <path d="M560 330l64-6"/>
      <path d="M550 352l20 34"/>
      <path d="M610 416l46 26"/>
      <path d="M558 426l-30 34"/>
      <path d="M534 470l128-12"/>
      <path d="M646 346l28 82"/>
    </g>
    <g fill="#d8dde2" font-size="13" font-weight="700" text-anchor="middle">
      <text x="532" y="337">WHY</text>
      <text x="652" y="327">WHAT</text>
      <text x="586" y="413">HOW</text>
      <text x="680" y="459">NOW</text>
      <text x="512" y="487">NEXT</text>
    </g>

    <rect x="856" y="188" width="280" height="360" rx="20" fill="#202b35" stroke="#78a9c4" stroke-width="2"/>
    <text x="888" y="230" fill="#f4f5f6" font-size="20" font-weight="700">Focused context</text>
    <text x="888" y="258" fill="#aeb8c2" font-size="15">One memory, multiple clients</text>

    <g fill="#17212a" stroke="#586776">
      <rect x="888" y="300" width="216" height="58" rx="12"/>
      <rect x="888" y="378" width="216" height="58" rx="12"/>
      <rect x="888" y="456" width="216" height="58" rx="12"/>
    </g>
    <g font-size="16" font-weight="700">
      <text x="916" y="325" fill="#d8dde2">Product</text>
      <text x="916" y="403" fill="#d8dde2">Engineering</text>
      <text x="916" y="481" fill="#d8dde2">AI agents</text>
    </g>
    <g fill="#78a9c4" font-size="11" font-weight="700" letter-spacing=".7">
      <text x="916" y="345">INTENT AND DECISIONS</text>
      <text x="916" y="423">IMPLEMENTATION</text>
      <text x="916" y="501">STARTING THEORY</text>
    </g>
  </g>

  <g fill="none" stroke="#eab65c" stroke-linecap="round" stroke-width="7">
    <path d="M344 369h116"/>
    <path d="M740 369h116"/>
  </g>
  <g fill="#eab65c">
    <path d="M450 356l20 13-20 13z"/>
    <path d="M846 356l20 13-20 13z"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">
    <text x="384" y="350" fill="#eab65c">COMPILE</text>
    <text x="784" y="350" fill="#eab65c">SERVE</text>
  </g>
</svg>
