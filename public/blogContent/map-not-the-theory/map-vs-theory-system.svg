<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">The map is not the theory</title>
  <desc id="description">A simple architecture map provides orientation, a more complex running system exposes retries, flags, and hidden constraints, and a team's living theory connects both through judgment.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#172832"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <circle cx="1090" cy="86" r="190" fill="#eab65c" opacity=".06"/>
  <circle cx="82" cy="590" r="230" fill="#78a9c4" opacity=".05"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="64" y="78" fill="#eab65c" font-size="17" font-weight="700" letter-spacing="3">ORIENTATION IS NOT UNDERSTANDING</text>
    <text x="64" y="128" fill="#f4f5f6" font-size="40" font-weight="750">Maps orient. Theory navigates.</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="64" y="188" width="300" height="362" rx="20" fill="#202b35" stroke="#3b4855"/>
    <text x="96" y="230" fill="#f4f5f6" font-size="20" font-weight="700">The map</text>
    <text x="96" y="258" fill="#aeb8c2" font-size="15">Useful simplification</text>

    <rect x="102" y="304" width="92" height="56" rx="12" fill="#17212a" stroke="#78a9c4"/>
    <text x="148" y="338" fill="#d8dde2" font-size="14" text-anchor="middle">Client</text>
    <rect x="238" y="304" width="92" height="56" rx="12" fill="#17212a" stroke="#78a9c4"/>
    <text x="284" y="338" fill="#d8dde2" font-size="14" text-anchor="middle">API</text>
    <rect x="170" y="430" width="92" height="56" rx="12" fill="#17212a" stroke="#78a9c4"/>
    <text x="216" y="464" fill="#d8dde2" font-size="14" text-anchor="middle">Data</text>
    <g fill="none" stroke="#78a9c4" stroke-linecap="round" stroke-width="4">
      <path d="M194 332h44"/>
      <path d="M270 360l-42 70"/>
      <path d="M250 430l34-70"/>
    </g>

    <rect x="450" y="188" width="300" height="362" rx="20" fill="#202b35" stroke="#db7f7f" stroke-width="2"/>
    <text x="482" y="230" fill="#f4f5f6" font-size="20" font-weight="700">The running system</text>
    <text x="482" y="258" fill="#aeb8c2" font-size="15">Behavior the map leaves out</text>

    <g fill="#17212a" stroke="#586776">
      <circle cx="512" cy="324" r="24"/>
      <circle cx="600" cy="304" r="24"/>
      <circle cx="686" cy="340" r="24"/>
      <circle cx="534" cy="432" r="24"/>
      <circle cx="626" cy="454" r="24"/>
      <circle cx="696" cy="424" r="24"/>
    </g>
    <g fill="none" stroke="#788794" stroke-linecap="round" stroke-width="3">
      <path d="M536 318l40-10"/>
      <path d="M624 312l38 20"/>
      <path d="M678 364l12 36"/>
      <path d="M672 432l-22 12"/>
      <path d="M602 448l-44-10"/>
      <path d="M524 408l-8-60"/>
      <path d="M552 426l54-98"/>
    </g>
    <g font-size="13" font-weight="700">
      <rect x="478" y="492" width="74" height="28" rx="8" fill="#3a2b2d"/>
      <text x="515" y="511" fill="#db7f7f" text-anchor="middle">RETRIES</text>
      <rect x="562" y="492" width="68" height="28" rx="8" fill="#3a2b2d"/>
      <text x="596" y="511" fill="#db7f7f" text-anchor="middle">FLAGS</text>
      <rect x="640" y="492" width="82" height="28" rx="8" fill="#3a2b2d"/>
      <text x="681" y="511" fill="#db7f7f" text-anchor="middle">HISTORY</text>
    </g>

    <rect x="836" y="188" width="300" height="362" rx="20" fill="#202b35" stroke="#eab65c" stroke-width="2"/>
    <text x="868" y="230" fill="#f4f5f6" font-size="20" font-weight="700">The team's theory</text>
    <text x="868" y="258" fill="#aeb8c2" font-size="15">Judgment built through experience</text>

    <text x="868" y="322" fill="#eab65c" font-size="15" font-weight="700">WHY</text>
    <text x="930" y="322" fill="#d8dde2" font-size="16">the boundary exists</text>
    <text x="868" y="380" fill="#eab65c" font-size="15" font-weight="700">WHEN</text>
    <text x="930" y="380" fill="#d8dde2" font-size="16">the map is wrong</text>
    <text x="868" y="438" fill="#eab65c" font-size="15" font-weight="700">WHERE</text>
    <text x="930" y="438" fill="#d8dde2" font-size="16">change belongs</text>
    <text x="868" y="496" fill="#eab65c" font-size="15" font-weight="700">WHAT</text>
    <text x="930" y="496" fill="#d8dde2" font-size="16">must stay true</text>
  </g>

  <g fill="none" stroke="#eab65c" stroke-linecap="round" stroke-width="7">
    <path d="M364 369h86"/>
    <path d="M750 369h86"/>
  </g>
  <g fill="#eab65c">
    <path d="M440 356l20 13-20 13z"/>
    <path d="M826 356l20 13-20 13z"/>
  </g>
</svg>
