<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Testing the Vault's value</title>
  <desc id="description">Blind runs on 12 real work requests, 24 runs per setup, compare two models with and without the Vault. Opus: accepted changes went from 11 to 16 of 24, blocker and major bugs from 9 to 0, and cost per accepted change from $7.79 to $4.12. Sonnet: accepted changes went from 7 to 8 of 24, blocker and major bugs from 16 to 10, and cost per accepted change from $4.70 to $3.31. The sample is small.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111820"/>
      <stop offset="1" stop-color="#18232c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <circle cx="1070" cy="92" r="180" fill="#eab65c" opacity=".06"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="72" y="92" fill="#eab65c" font-size="22" font-weight="700" letter-spacing="2">BLIND RUNS · 24 PER SETUP · SMALL SAMPLE</text>
    <text x="72" y="150" fill="#f1f4f8" font-size="52" font-weight="800" letter-spacing="-1.5">Two models. Context on and off.</text>

    <line x1="600" y1="196" x2="600" y2="540" stroke="#2b3440" stroke-width="2"/>

    <!-- Opus -->
    <g transform="translate(72 0)">
      <text x="0" y="214" fill="#f1f4f8" font-size="26" font-weight="800">Opus</text>

      <text x="0" y="256" fill="#c3cbd6" font-size="20" font-weight="600">Accepted changes</text>
      <rect x="0" y="268" width="138" height="24" rx="6" fill="#2b3440"/>
      <text x="150" y="287" fill="#9ba6b4" font-size="19" font-weight="700">11 of 24 without</text>
      <rect x="0" y="298" width="200" height="24" rx="6" fill="#eab65c"/>
      <text x="212" y="317" fill="#f1f4f8" font-size="19" font-weight="800">16 of 24 with the Vault</text>

      <text x="0" y="366" fill="#c3cbd6" font-size="20" font-weight="600">Blocker and major bugs</text>
      <rect x="0" y="378" width="135" height="24" rx="6" fill="#2b3440"/>
      <text x="147" y="397" fill="#9ba6b4" font-size="19" font-weight="700">9 without</text>
      <rect x="0" y="408" width="6" height="24" rx="3" fill="#eab65c"/>
      <text x="18" y="427" fill="#f1f4f8" font-size="19" font-weight="800">0 with the Vault</text>

      <text x="0" y="476" fill="#c3cbd6" font-size="20" font-weight="600">Cost per accepted change</text>
      <rect x="0" y="488" width="292" height="24" rx="6" fill="#2b3440"/>
      <text x="304" y="507" fill="#9ba6b4" font-size="19" font-weight="700">$7.79 without</text>
      <rect x="0" y="518" width="155" height="24" rx="6" fill="#eab65c"/>
      <text x="167" y="537" fill="#f1f4f8" font-size="19" font-weight="800">$4.12 with the Vault</text>
    </g>

    <!-- Sonnet -->
    <g transform="translate(632 0)">
      <text x="0" y="214" fill="#f1f4f8" font-size="26" font-weight="800">Sonnet</text>

      <text x="0" y="256" fill="#c3cbd6" font-size="20" font-weight="600">Accepted changes</text>
      <rect x="0" y="268" width="88" height="24" rx="6" fill="#2b3440"/>
      <text x="100" y="287" fill="#9ba6b4" font-size="19" font-weight="700">7 of 24 without</text>
      <rect x="0" y="298" width="100" height="24" rx="6" fill="#eab65c"/>
      <text x="112" y="317" fill="#f1f4f8" font-size="19" font-weight="800">8 of 24 with the Vault</text>

      <text x="0" y="366" fill="#c3cbd6" font-size="20" font-weight="600">Blocker and major bugs</text>
      <rect x="0" y="378" width="240" height="24" rx="6" fill="#2b3440"/>
      <text x="252" y="397" fill="#9ba6b4" font-size="19" font-weight="700">16 without</text>
      <rect x="0" y="408" width="150" height="24" rx="6" fill="#eab65c"/>
      <text x="162" y="427" fill="#f1f4f8" font-size="19" font-weight="800">10 with the Vault</text>

      <text x="0" y="476" fill="#c3cbd6" font-size="20" font-weight="600">Cost per accepted change</text>
      <rect x="0" y="488" width="176" height="24" rx="6" fill="#2b3440"/>
      <text x="188" y="507" fill="#9ba6b4" font-size="19" font-weight="700">$4.70 without</text>
      <rect x="0" y="518" width="124" height="24" rx="6" fill="#eab65c"/>
      <text x="136" y="537" fill="#f1f4f8" font-size="19" font-weight="800">$3.31 with the Vault</text>
    </g>

    <text x="72" y="592" fill="#9ba6b4" font-size="18" font-weight="600">12 real work requests, two runs each per setup. Encouraging, not proven.</text>
  </g>
</svg>
